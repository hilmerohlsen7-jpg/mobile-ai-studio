<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mobile AI Studio</title>
<style>
/* Warm paper look with a terracotta accent. Follows the phone's light/dark setting unless the person picks one. */
:root{--bg:#FAF9F5;--panel:#FFFFFF;--side:#F0EEE6;--pop:#FFFFFF;--line:#E3E0D5;--txt:#141413;--mute:#6B6A64;--acc:#C96442;--onacc:#FFFFFF;--user:#EFEDE4;--usertx:#141413;--code:#F4F2EA;--code2:#EAE7DC;--codetx:#8A3B20;--chip:#F0EEE6;--toast:#30302E;--bad:#B3261E;--ok:#2E7D4F;--warn:#B26A00;--drbg:#FBE4E1;--drtx:#9B2C22;--dabg:#E1F3E4;--datx:#1F6B3A;--dc:#7A7870;--glow:rgba(201,100,66,.35);--blue:#2978D5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151515;--panel:#20201E;--side:#1A1A19;--pop:#20201E;--line:#30302E;--txt:#F2F1EB;--blue:#2978D5;--mute:#9C9A92;--acc:#D97757;--user:#1A1918;--usertx:#ECEAE0;--code:#1F1E1D;--code2:#2B2A28;--codetx:#E8B4A0;--chip:#2B2A28;--toast:#141413;--bad:#FF8A80;--ok:#7DD3A0;--warn:#FFB74D;--drbg:#3A1A1A;--drtx:#FF8A80;--dabg:#17301C;--datx:#9BE39E;--dc:#8A8880;--glow:rgba(217,119,87,.45);color-scheme:dark}}
:root[data-theme=dark]{--bg:#151515;--panel:#20201E;--side:#1A1A19;--pop:#20201E;--line:#30302E;--txt:#F2F1EB;--blue:#2978D5;--mute:#9C9A92;--acc:#D97757;--user:#1A1918;--usertx:#ECEAE0;--code:#1F1E1D;--code2:#2B2A28;--codetx:#E8B4A0;--chip:#2B2A28;--toast:#141413;--bad:#FF8A80;--ok:#7DD3A0;--warn:#FFB74D;--drbg:#3A1A1A;--drtx:#FF8A80;--dabg:#17301C;--datx:#9BE39E;--dc:#8A8880;--glow:rgba(217,119,87,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;color:var(--acc);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,select,input,textarea{font:inherit}
button,select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button:disabled{opacity:.5}
select{max-width:140px}
button.pri{background:var(--acc);color:var(--onacc);font-weight:700;border:0}
button.danger{color:var(--bad)}
#status{min-height:18px;padding:2px 12px;font-size:.75rem;color:var(--mute)}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:10px;line-height:1.45;font-size:.92rem;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--usertx);border-radius:18px;padding:10px 14px}
.msg.assistant{align-self:flex-start;background:none;border:0;padding:4px 2px;max-width:100%;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.6}
.msg.hint{align-self:center;color:var(--mute);background:none;text-align:center;font-size:.85rem}
.cb{margin:6px 0;background:var(--code);border:1px solid var(--line);border-radius:8px;overflow:hidden;white-space:normal}
.cb .bar{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:var(--code2);font-size:.75rem;color:var(--mute)}
.cb .bar button{padding:2px 8px;font-size:.75rem}
.cb pre{margin:0;padding:8px 10px;overflow-x:auto;white-space:pre;font-size:.8rem;color:var(--codetx);font-family:monospace}
code.ic{background:var(--code);padding:1px 5px;border-radius:4px;color:var(--codetx);font-family:monospace}
footer{display:flex;gap:6px;align-items:flex-end;padding:8px;border-top:1px solid var(--line)}
footer textarea{flex:1;min-width:0;resize:none;max-height:140px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px}
.macts{margin-top:6px}
.macts button{padding:3px 10px;font-size:.75rem;margin-right:6px;font-family:system-ui,-apple-system,Roboto,sans-serif}
#micBtn.rec{background:#c0392b;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.pics{display:flex;gap:6px;flex-wrap:wrap}
.pics img{max-width:120px;max-height:120px;border-radius:8px;display:block}
.msg .pics{margin-bottom:6px}
#attach{display:none;gap:8px;padding:6px 10px 0;flex-wrap:wrap}
#attach.has{display:flex}
#attach .th{position:relative}
#attach .th img{height:56px;border-radius:8px;display:block}
#attach .th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;border-radius:11px;line-height:1}
.ib{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:4}
#scrim.open{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(88vw,360px);background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:12px;z-index:5;transform:translateX(-105%);transition:transform .2s;display:flex;flex-direction:column;gap:6px}
#drawer.open{transform:none}
#drawer>*{flex-shrink:0}
#drawer h3{margin:12px 0 2px;color:var(--acc);font-size:.95rem}
#drawer label{font-size:.8rem;color:var(--mute);margin-top:6px}
#drawer .row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:.9rem;word-break:break-all}
#drawer .row.sel{border-color:var(--acc)}
#drawer .row button{padding:2px 8px}
#drawer .skill.on{border-color:var(--acc);color:var(--acc)}
#drawer textarea{width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px}
#settings{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;flex-direction:column}
#settings.open{display:flex}
#sethead{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;flex-shrink:0}
#settings #sethead button{width:40px;height:40px;margin:0;border:0;background:none;font-size:1.4rem;padding:0;color:var(--txt)}
#setTitle{font-family:Georgia,'Times New Roman',serif;font-size:1.35rem;text-align:center;flex:1}
#setBody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px 40px}
.pg[hidden],#settings [hidden]{display:none!important}
#settings label>input,#settings label>select{display:block;box-sizing:border-box}
#settings select{box-sizing:border-box;max-width:100%}
#settings label{display:block;font-size:.8rem;color:var(--mute);margin-top:14px}
#settings input[type=text],#settings input[type=number],#settings input[type=password],#settings select{width:100%;margin-top:4px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px}
#settings button{width:100%;margin-top:10px;border-radius:12px;padding:12px}
#settings .srow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:0;border-radius:16px;padding:14px 16px;margin-top:8px;color:var(--txt)}
.si{width:28px;text-align:center;font-size:1.2rem;flex-shrink:0}
.st{flex:1;min-width:0;display:flex;flex-direction:column}
.st b{font-weight:500;font-size:1rem}
.st small{color:var(--mute);font-size:.8rem;margin-top:2px}
.sc{color:var(--mute);font-size:1.4rem}
.avrow{display:flex;align-items:center;gap:14px;padding:10px 4px 6px}
.avt{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-family:Georgia,serif}
.scard{background:var(--panel);border-radius:16px;padding:14px 16px;margin-top:8px}
.sct{font-size:1rem;margin-bottom:10px}
.modes{display:flex;gap:10px}
#settings .modes button{flex:1;margin:0;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;color:var(--mute);font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:6px}
#settings .modes button.sel{border-color:var(--blue);color:var(--txt)}
.th{display:block;width:100%;height:54px;border-radius:10px;border:1px solid var(--line);position:relative}
.th::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.th.l{background:#FAF9F5}.th.d{background:#151515}.th.a{background:linear-gradient(115deg,#FAF9F5 50%,#151515 50%)}
.note{color:var(--mute);font-size:.82rem;margin-top:8px;line-height:1.4}
.overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:8;overflow-y:auto;padding:14px}
.overlay.open{display:block}
.overlay h2{margin:4px 0 4px;color:var(--acc);font-size:1.15rem}
.overlay .sub{color:var(--mute);font-size:.85rem;margin-bottom:12px}
.mrow{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.mrow.sel{border-color:var(--acc)}
.mrow .nm{font-weight:600}
.mrow .nt{font-size:.8rem;color:var(--mute);margin:3px 0 6px}
.mrow .warn{font-size:.78rem;color:var(--warn);margin-bottom:6px}
.mrow .err{font-size:.78rem;color:var(--bad);margin-bottom:6px}
.mrow .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{color:var(--ok);font-size:.82rem}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:80px}
.pbar i{display:block;height:100%;background:var(--acc);width:0}
.pct{font-size:.78rem;color:var(--mute)}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:16px;margin-top:24px}
.card p{margin:8px 0;line-height:1.45;font-size:.92rem}
.card button{width:100%;margin-top:8px;padding:12px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:12;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
#modal .box{background:var(--pop);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(92vw,360px)}
#modal .mt{margin-bottom:10px;line-height:1.4;font-size:.95rem}
#modal input{width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
#modal .btns{display:flex;gap:8px;justify-content:flex-end}
#dlBtn{position:relative}
#dlBadge{display:none;position:absolute;top:-5px;right:-5px;background:var(--acc);color:var(--onacc);border-radius:9px;font-size:.65rem;font-weight:700;padding:1px 5px;min-width:16px;text-align:center}
.overlay.z9{z-index:9}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.topbar h2{flex:1;margin:0}
.box2{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.box2 h3{margin:0 0 6px;font-size:.92rem;color:var(--acc)}
.box2 input[type=text],.box2 input[type=search]{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.srow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0;font-size:.85rem}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp button{padding:2px 10px;min-width:32px}
.stp b{min-width:20px;text-align:center}
.drow .nm{font-weight:600;word-break:break-all}
.drow .meta{font-size:.78rem;color:var(--mute);margin:3px 0 6px;word-break:break-all}
.drow .meta.bad{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{padding:4px 10px;font-size:.8rem;border-radius:14px}
.fl{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.85rem}
.fl .fn{flex:1;min-width:0;word-break:break-all}
.fl .q{color:var(--acc);font-weight:600}
.fl .w{font-size:.75rem;color:var(--warn)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--toast);color:#fff;padding:8px 14px;border-radius:20px;font-size:.85rem;display:none;z-index:20;max-width:90vw;text-align:center}
.crumbs{font-size:.8rem;color:var(--mute);margin:2px 0 8px;word-break:break-all}
.frow{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.frow .fmain{flex:1;min-width:0;cursor:pointer}
.frow .nm{font-size:.92rem;word-break:break-all}
.frow .meta{font-size:.74rem;color:var(--mute)}
.fedit{width:100%;min-height:50vh;background:var(--code);color:var(--codetx);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:monospace;font-size:.8rem;white-space:pre}
#approve{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:13;overflow-y:auto;padding:12px}
#approve.open{display:block}
.acard{background:var(--pop);border:1px solid var(--acc);border-radius:12px;padding:14px;max-width:560px;margin:0 auto}
.acard .at{font-size:1.05rem;font-weight:700;color:var(--acc);margin-bottom:8px}
.acard .al{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-top:10px}
.acard .av{font-size:.9rem;word-break:break-all}
.acard .av.path{font-family:monospace;font-size:.82rem;color:var(--txt)}
.acard .an{font-size:.78rem;color:var(--warn);margin-top:10px}
.acard pre.prev{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.78rem;max-height:30vh;overflow:auto;white-space:pre-wrap;margin:4px 0 0}
.diff{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:monospace;font-size:.76rem;max-height:36vh;overflow:auto;margin-top:4px}
.diff .dh{color:var(--mute);margin-bottom:4px;font-family:sans-serif}
.diff div{white-space:pre-wrap;word-break:break-all}
.diff .dc{color:var(--dc)}.diff .dr{background:var(--drbg);color:var(--drtx)}.diff .da{background:var(--dabg);color:var(--datx)}.diff .dm{color:var(--mute);font-style:italic}
.abtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.abtns button{padding:12px;font-size:.92rem}
.abtns button.big{font-size:1rem;padding:14px;box-shadow:0 0 0 2px var(--glow)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:12;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .sbox{background:var(--bg);border-radius:28px 28px 0 0;padding:22px 14px 14px;position:relative;width:min(100vw,480px);display:flex;flex-direction:column;gap:8px}
#sheet .mt{font-family:Georgia,serif;font-size:1.1rem;text-align:center;word-break:break-all}
#sheet .sbox::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#4a4a46}
#undobar{display:none;position:fixed;bottom:12px;left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--toast);color:#fff;border:1px solid var(--acc);border-radius:12px;padding:10px 12px;z-index:14;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem}
.tchips{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tchips:not(:empty){margin-bottom:6px}
.tchip{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--mute);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:3px 10px;white-space:normal}
.tchip button{padding:2px 8px;font-size:.75rem}
#settings .chk{display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse;gap:14px;font-size:.95rem;color:var(--txt);background:var(--panel);border-radius:14px;padding:14px 16px;margin-top:8px}
#settings .chk input{appearance:none;-webkit-appearance:none;flex-shrink:0;width:46px;height:28px;margin:0;border-radius:14px;background:#4a4a46;position:relative;transition:background .15s;border:0}
#settings .chk input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
#settings .chk input:checked{background:var(--blue)}
#settings .chk input:checked::after{transform:translateX(18px)}
#settings .chk input:disabled{opacity:.45}
html[data-font=serif] body,html[data-font=serif] button,html[data-font=serif] textarea,html[data-font=serif] select{font-family:Georgia,'Times New Roman',serif}
html[data-font=sans] body,html[data-font=sans] button,html[data-font=sans] textarea,html[data-font=sans] select{font-family:Roboto,Arial,sans-serif}
.dlist{max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:4px 0}
.drow2{display:flex;gap:10px;align-items:flex-start;padding:8px;border-bottom:1px solid var(--line)}
.drow2 input{width:22px;height:22px;flex-shrink:0;margin-top:2px}
.drow2 .dn{display:flex;flex-direction:column;min-width:0;font-size:.86rem;word-break:break-all}
.drow2 .dp{color:var(--mute);font-size:.72rem}
.abtns button:disabled{opacity:.45}
/* Claude Android look for the main screen */
header{border-bottom:0;padding:10px 8px 4px;gap:2px}
header button,header select{background:none;border:0;font-size:1.25rem;padding:8px 10px;color:var(--txt)}
header select{font-size:.95rem;color:var(--mute);max-width:120px}
#title{color:var(--txt);font-family:Georgia,'Times New Roman',serif;font-size:1.15rem;font-weight:500;text-align:center}
#chat{padding:8px 16px}
.msg.user{border-radius:20px;padding:10px 16px}
.tchip{background:var(--panel);border:0}

.ahead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

.atiles{display:flex;gap:10px;margin:6px 0 10px}

.aico{width:44px;height:44px;border-radius:50%;background:var(--side);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}

.arow{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:20px;background:var(--panel);padding:14px 16px}

<script>
const $ = id => document.getElementById(id);
const hasBridge = typeof Android !== 'undefined';

const DEFAULT_SKILLS = {
  code:   {id: 'code',   name: 'Code helper',    prompt: 'You are an expert programmer. Give correct, working code in fenced code blocks with the language name, then a short explanation.'},
  simple: {id: 'simple', name: 'Explain simply', prompt: 'Explain things in plain, simple language with a small example. Avoid jargon.'},
  review: {id: 'review', name: 'Code reviewer',  prompt: 'When shown code, review it: list bugs first, then improvements, then show the fixed code.'},
  debug:  {id: 'debug',  name: 'Debug an error', prompt: 'When shown an error message, explain what it means, the most likely cause, and the exact fix.'}
};
const DEFAULT_SETTINGS = {model: '', num_predict: 512, num_ctx: 2048, num_thread: 0, temperature: 0.7, aiFiles: true, aiWeb: true, aiAuto: true, ttsAuto: false, sttSend: true, convo: true, ttsRate: 1, userName: '', city: '', greet: true};

let S = {projects: {}, skills: {}, settings: {}, last: ''};
let dev = {ramMB: 0, cores: 4, freeMB: 0, engine: true};
let models = [];
let dl = {};            // progress of file imports by model id
let dls = [];           // download manager list
let dlSettings = {max: 2, threads: 4};
let cur = null;         // current project
let busy = false;       // a reply is being generated
let genProject = null, genBox = null, genAcc = '', genPrompt = '', genStart = 0, renderQueued = false;

/* ---------- small helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'value') e.value = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c !== null && c !== undefined && c !== false) e.append(c); });
  return e;
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3); }
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3500);
}
function mb(n) { return n >= 1024 ? (n / 1024).toFixed(1) + ' GB' : Math.round(n) + ' MB'; }

/* ---------- Share to this app ---------- */
const URL_RE = /(magnet:\?[^\s]+|(?:https?|ftp):\/\/[^\s<>"]+)/ig;
async function pickProject() {
  const opts = projectList().map(p => ({label: (cur && cur.id === p.id ? '\u2713 ' : '') + p.name, value: p.id}));
  opts.push({label: '+ New project', value: '__new'});
  const v = await choose('Add to which project?', opts); if (!v) return null;
  if (v === '__new') { const n = await askText('Project name?', ''); if (!n || !n.trim()) return null; return makeProject(n.trim()).id; }
  return v;
}
async function handleShare(sh) {
  const links = ((sh.text || '').match(URL_RE) || []).map(x => x.replace(/[.,;)]+$/, ''));
  const files = sh.files || [];
  const opts = [];
  if (links.length) opts.push({label: '\u2B07 Download this link' + (links.length > 1 ? 's (' + links.length + ')' : ''), value: 'download'});
  files.forEach(f => { if (/\.torrent$/i.test(f.name)) opts.push({label: '\u2B07 Start torrent: ' + f.name.slice(0, 40), value: 'torrent:' + f.id}); });
  const readable = files.filter(f => !/\.torrent$/i.test(f.name));
  if (readable.length || (sh.text || '').trim()) opts.push({label: '\u{1F4C1} Add to an AI project', value: 'project'});
  if (readable.some(f => f.image)) opts.push({label: '\u{1F4F7} Ask the AI about this picture', value: 'image'});
  else if ((sh.text || '').trim()) opts.push({label: '\u{1F4AC} Ask the AI about it now', value: 'ask'});
  if (readable.length) opts.push({label: '\u{1F4BE} Save a copy in the Download folder', value: 'save'});
  const what = files.length ? (files.length === 1 ? files[0].name : files.length + ' files') : (links[0] ? links[0].slice(0, 60) : 'text');
  const v = await choose('Shared: ' + what, opts);
  if (!v) { files.forEach(f => Android.docDiscard(f.id)); return; }
  if (v === 'download') {
    let ok = 0, last = '';
    for (const u of links) { try { const r = JSON.parse(Android.dlAdd(u, 0)); if (r.ok) ok++; else last = r.msg; } catch (e) { last = 'Could not add it.'; } }
    toast(ok ? 'Added ' + ok + ' to Downloads' : (last || 'Could not add it.')); if (ok) { pullDownloads(); openDownloads(); }
  } else if (v.startsWith('torrent:')) {
    const id = v.slice(8); let a; try { a = JSON.parse(Android.docStartTorrent(id)); } catch (e) { a = {ok: false, msg: 'Could not start it.'}; }
    if (a.ok) { toast('Added to Downloads'); pullDownloads(); openDownloads(); } else toast(a.msg);
  } else if (v === 'project') {
    const pid = await pickProject(); if (!pid) return;
    docTargetId = pid; setTimeout(() => { if (docTargetId === pid) docTargetId = null; }, 60000);
    if ((sh.text || '').trim() && !links.length) { S.projects[pid].files.push({name: 'Shared text.txt', text: sh.text.slice(0, 200000)}); persist(); renderDrawer(); toast('Added the text to "' + S.projects[pid].name + '".'); }
    else if (links.length && !readable.length) { S.projects[pid].files.push({name: 'Shared link.txt', text: sh.text.slice(0, 20000)}); persist(); renderDrawer(); toast('Added the link text to "' + S.projects[pid].name + '".'); }
    readable.forEach(f => Android.docProcess(f.id));
  } else if (v === 'image') {
    const f = readable.find(x => x.image); Android.docAsImage(f.id);
  } else if (v === 'ask') {

function copyText(text, btn) {

function codeBlock(el, lang, code) {
  const text = code.replace(/\n$/, '');

  const save = hasBridge && Android.fsAccess !== undefined ? h('button', {onclick: () => saveCodeBlock(text, lang)}, 'Save') : null;
  el.append(h('div', {class: 'cb'}, h('div', {class: 'bar'}, h('span', null, lang || 'code'), h('span', {style: 'display:flex;gap:6px'}, save, btn)), h('pre', null, text)));
}
function inline(el, s) {
  if (!s) return;

    if (!part) return;

    else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) el.append(h('code', {class: 'ic'}, part.slice(1, -1)));

  while ((m = re.exec(text)) !== null) {
    inline(el, text.slice(last, m.index).replace(/\n$/, ''));
    codeBlock(el, m[1], m[2]);

}

function lineDiff(a, b) {

}

    if (lines.length > max) box.append(h('div', {class: 'dm'}, '... ' + (lines.length - max) + ' more lines'));
  };
  box.append(h('div', {class: 'dh'}, d.removed.length + ' line(s) removed, ' + d.added.length + ' line(s) added, starting at line ' + d.line));
