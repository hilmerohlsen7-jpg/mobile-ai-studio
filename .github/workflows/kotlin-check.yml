name: Kotlin check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Install Android build tools
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.10.2"}
      - run: gradle --no-daemon -q :app:compileReleaseKotlin 2>&1 | grep -E "^e: |error:|FAILED|BUILD|Could not" | head -40
