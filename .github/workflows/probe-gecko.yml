name: Probe GeckoView
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Look
        shell: bash
        run: |
          B=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a
          V=160.0.20261104181552
          curl -sfL -o g.aar $B/$V/geckoview-arm64-v8a-$V.aar
          unzip -q g.aar classes.jar -d g
          for c in GeckoPreferenceController 'GeckoPreferenceController$SetGeckoPreference' 'GeckoPreferenceController$GetGeckoPreference' GeckoSessionSettings; do echo "=== $c"; javap -cp g/classes.jar "org.mozilla.geckoview.$c" 2>&1 | grep -v "^  static\|^  private\|^  final" | head -40; done
          unzip -l g.aar | grep -i "libxul\|libmozglue" | head
