name: Probe GeckoView
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Look at GeckoView
        shell: bash
        run: |
          B=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a
          curl -sf $B/maven-metadata.xml | grep -E "<(latest|release)>|<version>" | tail -6
          V=$(curl -sf $B/maven-metadata.xml | grep -oP "(?<=<release>).*(?=</release>)")
          echo "VERSION=$V"
          curl -sfL -o g.aar $B/$V/geckoview-arm64-v8a-$V.aar; ls -la g.aar
          unzip -q g.aar classes.jar -d g
          for c in 'WebExtension$PermissionPromptResponse' 'WebExtension$MetaData' 'WebExtensionController$EnableSource' GeckoView AllowOrDeny 'GeckoSession$Settings' 'GeckoSession$Settings$Builder' GeckoSessionSettings WebResponse 'GeckoSession$ContentDelegate$ContextElement' 'GeckoSession$NavigationDelegate$LoadRequest' WebExtensionController\$PromptDelegate; do echo "=== $c"; javap -cp g/classes.jar "org.mozilla.geckoview.$c" 2>&1 | grep -v "^  static\|^  private\|^  final" | head -45; done
          javap -p -cp g/classes.jar 'org.mozilla.geckoview.GeckoSession' | grep -E " (open|close|loadUri|goBack|goForward|reload|stop|setNavigationDelegate|setProgressDelegate|setContentDelegate|setPromptDelegate|getSettings|setActive|setFocused|getWebExtensionController|requestAnalysis|exitFullScreen)\("
          javap -cp g/classes.jar 'org.mozilla.geckoview.WebExtensionController$PromptDelegate' | grep onInstallPromptRequest -A2
