name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['pc/**', '.github/workflows/pc-tool.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  LLAMA_CPP_TAG: b12040

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Get the AI engine (llama.cpp)
        shell: bash
        run: git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp

      - name: Get the archive reader (libarchive)
        shell: bash
        run: git clone --depth 1 --branch v3.7.7 https://github.com/libarchive/libarchive app/src/main/cpp/libarchive

      - name: Build 7-Zip (opens disk images, installers and many other archives)
        continue-on-error: true
        shell: bash
        run: |
          git clone --depth 1 --branch 24.09 https://github.com/ip7z/7zip /tmp/7zip
          BIN="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd /tmp/7zip/CPP
          sed -i 's/^#if defined(TIME_UTC)/#if 0/' Windows/TimeUtils.cpp
          sed -i 's/-Werror//; s/-Weverything//; s/-Wfatal-errors//' 7zip/warn_clang.mak 7zip/7zip_gcc.mak
          sed -i 's/-lpthread//g' 7zip/7zip_gcc.mak
          cd 7zip/Bundles/Alone2
          mkdir -p b/g
          make -j4 -f ../../cmpl_clang_arm64.mak CC="$BIN/aarch64-linux-android26-clang" CXX="$BIN/aarch64-linux-android26-clang++" USE_ASM= LOCAL_FLAGS="-DZ7_AFFINITY_DISABLE"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp b/c_arm64/7zz "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsz.so"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the app
        shell: bash
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Keep the APK as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: MobileAIStudio-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish the APK on the Releases page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MobileAIStudio.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MobileAIStudio.apk \
            --title "Mobile AI Studio (latest build)" \
            --notes "Download MobileAIStudio.apk below and open it on your phone to install."

      - name: Save the build log so problems can be diagnosed
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/log
          if [ -f build.log ]; then tail -n 4000 build.log > /tmp/log/build.log; else echo "no build log" > /tmp/log/build.log; fi
          if [ -f probe.log ]; then cp probe.log /tmp/log/probe.log; fi
          cd /tmp/log
          git init -q
          git checkout -q -b build-logs
          git add build.log
          if [ -f probe.log ]; then git add probe.log; fi
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "build log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
